<meta charset="utf-8">
<title>__PAGE_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 목차 + 가운데 읽기 칸. 질문·메모는 해당 문단 바로 아래에 붙는 '여백 노트'로 */
:root{
  --paper:#f6f7f4; --sheet:#ffffff; --ink:#1c2326; --muted:#5b676b; --line:#dbe0dc; --line2:#c3cbc6;
  --accent:#0d6b70; --accent-soft:#e2f0ef; --note:#b7791f; --note-soft:#fbf3e2; --note-line:#ecd29b;
  --ok:#2f7a3d; --ok-soft:#e5f2e7; --warn:#a15c07; --warn-soft:#fbefdc; --bad:#b4312a; --bad-soft:#fbe7e5;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-title:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-mono:"IBM Plex Mono",Consolas,"D2Coding",monospace;
  --side:272px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111618; --sheet:#171d20; --ink:#e3e8e6; --muted:#9aa7aa; --line:#29333a; --line2:#3a4750;
  --accent:#5fc2c6; --accent-soft:#16343a; --note:#e2b24a; --note-soft:#2e2717; --note-line:#5b4a22;
  --ok:#7fcb8b; --ok-soft:#183020; --warn:#e9a54d; --warn-soft:#33260f; --bad:#f08a80; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111618; --sheet:#171d20; --ink:#e3e8e6; --muted:#9aa7aa; --line:#29333a; --line2:#3a4750;
  --accent:#5fc2c6; --accent-soft:#16343a; --note:#e2b24a; --note-soft:#2e2717; --note-line:#5b4a22;
  --ok:#7fcb8b; --ok-soft:#183020; --warn:#e9a54d; --warn-soft:#33260f; --bad:#f08a80; --bad-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.72}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
/* 목차 */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--sheet);
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{font-family:var(--f-title);font-size:17px;font-weight:700;line-height:1.35;margin:0 0 4px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.nav h4{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:20px 0 6px}
.nav a{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:5px 9px;margin:1px 0;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.4}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--sheet)}
.nav a .cnt{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:9px;background:var(--note-soft);color:var(--note);border:1px solid var(--note-line)}
.nav a[aria-current="page"] .cnt{background:transparent;color:var(--sheet);border-color:currentColor}
/* 본문 */
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;margin-bottom:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.topbar .menu{display:none}
.status{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-left:auto}
.status b{font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--sheet);border-radius:7px;padding:5px 11px;font-size:13px;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.note{background:var(--note-soft);border-color:var(--note-line);color:var(--note)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.tier{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tier select{border:1px solid var(--line2);border-radius:7px;background:var(--sheet);padding:4px 6px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}
.vhead h1{font-family:var(--f-title);font-size:26px;line-height:1.35;margin:4px 0 6px;text-wrap:balance}
.vhead .kick{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:9px 13px;font-size:14px;margin:10px 0}
.notice b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:14px 0 18px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:10px 13px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad);background:var(--bad-soft)} .tile.alert b{color:var(--bad)}
a.tile{text-decoration:none;color:inherit} a.tile:hover{border-color:var(--accent)}
/* 일정 (dash 1.3.0, 한화 연구 대시보드에서 옮김): D-day 칸·기간 막대·표 날짜 칩 */
.tile.soon{border-color:var(--warn);background:var(--warn-soft)} .tile.soon b{color:var(--warn)}
.tile.done{opacity:.6}
.period{margin:4px 0 22px}
.ptrack{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:visible}
.pfill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.pmark{position:absolute;top:-4px;width:3px;height:20px;margin-left:-1px;background:var(--warn);border-radius:1px}
.pnow{position:absolute;top:-6px;width:12px;height:24px;margin-left:-6px;border-radius:6px;border:3px solid var(--sheet);background:var(--ink)}
.plabels{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.plabels b{color:var(--ink);font-weight:500}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.plegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.plegend .pm{background:var(--warn)} .plegend .pn{background:var(--ink);border-radius:50%}
.dd{display:inline-block;margin-left:6px;padding:0 7px;border-radius:9px;font-family:var(--f-mono);font-size:11.5px;line-height:1.6;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.dd.soon{background:var(--warn-soft);color:var(--warn)}
.dd.past{background:transparent;color:var(--muted);border:1px solid var(--line)}
tr.past td{color:var(--muted)}
.tile b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.card{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:6px 20px 10px;margin:12px 0 18px}
.card .doc h2{border-top:0;margin-top:12px}
.files{border:1px dashed var(--line2);border-radius:10px;padding:8px 14px;margin:10px 0 18px;font-size:13.5px}
.files summary{cursor:pointer;color:var(--muted);font-weight:500}
.frow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow code{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;flex:1 1 260px;min-width:0}
.frow .t{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{cursor:pointer;border:0;background:none;padding:7px 4px 9px;margin-right:12px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.dochead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 0 14px}
.dochead code{font-family:var(--f-mono);font-size:12px;word-break:break-all}
.linkbtn{cursor:pointer;border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
/* 문서 블록 */
.doc{position:relative}
.blk{position:relative;border-left:3px solid transparent;padding-left:12px;margin-left:-15px;border-radius:2px}
.blk:hover{border-left-color:var(--line)}
.blk.noted{border-left-color:var(--note-line)}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--note-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.blk.flash{animation:none;background:var(--note-soft)}}
.ask{position:absolute;left:-40px;top:2px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--sheet);color:var(--muted);
  cursor:pointer;font-size:13px;line-height:1;opacity:0;transition:opacity .12s}
.blk:hover>.ask,.ask:focus-visible{opacity:1}
.doc h1{font-family:var(--f-title);font-size:23px;line-height:1.4;margin:26px 0 10px;text-wrap:balance}
.doc h2{font-family:var(--f-title);font-size:20px;line-height:1.4;margin:30px 0 8px;padding-top:6px;border-top:1px solid var(--line);text-wrap:balance}
.doc h3{font-size:16.5px;margin:22px 0 6px;font-weight:600}
.doc h4,.doc h5,.doc h6{font-size:15px;margin:16px 0 4px;font-weight:600}
.doc p{margin:8px 0}
.doc ul,.doc ol{margin:6px 0;padding-left:22px}
.doc li{margin:2px 0}
.doc code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:0 4px;border-radius:4px;word-break:break-word}
.doc pre{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.doc pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
figure{margin:14px 0}
figure img{display:block;max-width:100%;height:auto;border-radius:6px;background:#fff;border:1px solid var(--line)}
figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.55}
.mathd{overflow-x:auto;margin:10px 0}
details.co{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0;background:var(--accent-soft);padding:4px 12px;margin:10px 0}
details.co>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.co-warning{border-left-color:var(--bad);background:var(--bad-soft)} details.co-warning>summary{color:var(--bad)}
details.co-example,details.co-tip{border-left-color:var(--ok);background:var(--ok-soft)} details.co-example>summary,details.co-tip>summary{color:var(--ok)}
details.co-note{border-left-color:var(--warn);background:var(--warn-soft)} details.co-note>summary{color:var(--warn)}
blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--line2);color:var(--muted)}
.lnk{border-bottom:1px dotted var(--muted)}
.miss{color:var(--muted);font-size:13px}
.loading{color:var(--muted);font-size:14px;padding:30px 0}
/* 여백 노트 (질문·답·메모) */
.thread{border:1px solid var(--note-line);background:var(--note-soft);border-radius:10px;margin:8px 0 16px;padding:8px 12px 10px;font-size:14.5px}
.thread.hidden-notes{display:none}
.th-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--note)}
.th-top .tag{font-weight:600;letter-spacing:.04em}
.th-top .when{font-family:var(--f-mono);color:var(--muted)}
.th-top .sp{flex:1}
.quote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--note);color:var(--muted);font-size:13.5px}
details.turn{border-top:1px dashed var(--note-line);padding:4px 0}
details.turn:first-of-type{border-top:0}
details.turn>summary{cursor:pointer;font-weight:500;list-style-position:outside}
.ans{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:6px 0;font-size:14.5px}
.ans p{margin:6px 0}
.ans.streaming{white-space:pre-wrap}
.memo{margin-top:8px;border-top:1px solid var(--note-line);padding-top:6px}
.memo .lab{font-size:12px;font-weight:600;color:var(--note);letter-spacing:.04em}
.memo .body p{margin:4px 0}
textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line2);border-radius:8px;background:var(--sheet);padding:8px 10px;line-height:1.55}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.row .msg{font-size:12.5px;color:var(--muted)}
.row .err{font-size:12.5px;color:var(--bad)}
.followup{display:flex;gap:6px;margin-top:6px}
.tact{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 4px;font-size:12.5px}
.tact .linkbtn{font-size:12.5px;color:var(--muted)}
.tact .linkbtn:hover{color:var(--accent)}
.tact .linkbtn.danger:hover,.linkbtn[data-armed]{color:var(--bad)}
.edited{font-size:11.5px;font-weight:400;color:var(--muted)}
.tedit{margin:6px 0}
.tedit .lab{font-size:12px;font-weight:600;color:var(--note)}
.followup input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:7px;background:var(--sheet);padding:5px 9px}
/* 선택 도구막대 */
.seltool{position:absolute;z-index:20;display:flex;gap:4px;background:var(--ink);border-radius:8px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.seltool button{cursor:pointer;border:0;border-radius:6px;padding:4px 10px;font-size:13px;background:transparent;color:var(--paper)}
.seltool button:hover{background:rgba(255,255,255,.15)}
/* 노트 모음 */
.nitem{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;margin:10px 0}
.nitem .where{font-size:12.5px;color:var(--muted)}
.nitem .qs{margin:4px 0 0;padding-left:18px}
.nitem .mm{background:var(--note-soft);border:1px solid var(--note-line);border-radius:8px;padding:4px 10px;margin-top:6px;font-size:14px}
.search{width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--sheet);padding:7px 11px;margin:6px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:30}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:16px;color:var(--muted);font-size:14px}
/* 논문 서재 (library) */
.side .search{margin:8px 0 6px;font-size:13.5px}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;font-size:13.5px;font-weight:500;padding:4px 6px;border-radius:6px;list-style:none;display:flex;gap:6px;align-items:baseline}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--muted);font-size:11px;flex:0 0 10px}
.tree details[open]>summary::before{content:"▾"}
.tree summary:hover{background:var(--accent-soft)}
.tree summary .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tree .sub{padding-left:12px;border-left:1px solid var(--line);margin-left:9px}
.tree a.pp{display:flex;gap:6px;align-items:baseline;padding:3px 7px;margin:0;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13px;line-height:1.35}
.tree a.pp:hover{background:var(--accent-soft)}
.tree a.pp[aria-current="page"]{background:var(--accent);color:var(--sheet)}
.tree a.pp .y{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:0 0 auto}
.tree a.pp[aria-current="page"] .y{color:inherit;opacity:.8}
.tree a.pp .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree a.pp .mk{font-size:11px;flex:0 0 auto}
.tree a.pp .cnt{font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:9px;background:var(--note-soft);color:var(--note);border:1px solid var(--note-line)}
.tree a.pp[aria-current="page"] .cnt{background:transparent;color:inherit;border-color:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);background:var(--sheet)}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.ac{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.tag{background:var(--paper)}
.pmeta{font-size:13.5px;color:var(--muted);margin:2px 0 4px}
.pmeta a{word-break:break-all}
.sumcard{border:1px solid var(--accent);border-radius:12px;background:var(--sheet);padding:10px 18px 12px;margin:12px 0 18px}
.sumcard .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.sumcard .top b{color:var(--accent);font-weight:600}
.sumcard .body{font-size:15px}
.sumcard .body p{margin:6px 0}
.sumcard .body h3,.sumcard .body strong.h{display:block;font-size:14.5px;margin:12px 0 2px;color:var(--accent)}
.sumcard figure{margin:10px 0}
.sumcard .streaming{white-space:pre-wrap}
.sumcard .sumdoc .blk{margin-left:-15px}
.sumcard .sumdoc h3{color:var(--accent);font-size:14.5px;margin:12px 0 2px}
.figref{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.sumcard .sumdoc .blk figure{margin:8px 0 4px 0;max-width:640px}
.sumcard .sumdoc .blk figure figcaption{font-size:12px}
.sumcard .sumdoc .fignote{margin:2px 0 10px 0;padding:6px 12px 6px 14px;border-left:3px solid var(--accent-soft);background:var(--paper);border-radius:0 8px 8px 0;font-size:14px;max-width:640px}
.sumcard .sumdoc .fignote .lab{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
.sumcard .sumdoc .fignote p{margin:4px 0}
.reqbox{border:1px dashed var(--accent);border-radius:12px;background:var(--sheet);padding:10px 16px 12px;margin:0 0 14px}
.reqbox .lab{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin-bottom:4px}
.reqbox textarea{min-height:56px;margin-top:6px}
.reqbox .chips .chip{cursor:pointer;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.reqbox .chips .chip:hover{background:var(--accent);color:var(--sheet)}
.reqcard{border-color:var(--line2);border-left:4px solid var(--accent)}
.reqcard .top .q{font-weight:600;color:var(--ink);font-size:14px;flex:1 1 280px;min-width:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:12px 0}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--sheet)}
.gallery figure img{cursor:zoom-in;border:0}
.gallery figcaption b{color:var(--ink)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.doc figure.eq img{max-width:min(100%,560px);border:0;background:transparent}
.sres{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 14px;margin:8px 0}
.sres .w{font-size:12px;color:var(--muted)}
.sres a.t{font-size:15px;font-weight:500;text-decoration:none}
.sres .ex{font-size:13px;color:var(--muted);margin:3px 0 0}
mark{background:var(--note-soft);color:inherit;padding:0 1px}
.recent{list-style:none;padding:0;margin:6px 0}
.recent li{padding:4px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:baseline}
.recent li:first-child{border-top:0}
.recent .y{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:0 0 auto}
.recent .m{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:auto;flex:0 0 auto}
.doc section[data-part]{display:contents}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;transform:translateX(-105%);transition:transform .18s;box-shadow:0 0 30px rgba(0,0,0,.25);
    padding-left:max(16px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .topbar .menu{display:inline-block}
  .blk{margin-left:0;padding-left:8px}
  .ask{left:auto;right:0;top:-2px;opacity:.55}
  .status{margin-left:0}
}

<script>

const docParts = new Map();            // key -> {legacy, body, brief} (library)

try { showNotes = localStorage.getItem('dash-show-notes') !== '0'; } catch(e) {}
/* 답 모델 (dash 1.1.0): 빠름=Haiku, 보통=Sonnet, 깊게=Opus 계열. 실제 버전은 claude.ai가 정함. 기본값은 설정 ASK_TIER */
const TIERS = [['quick', '빠름 (Haiku)'], ['default', '보통 (Sonnet)'], ['complex', '깊게 (Opus)']];
const TIER_NAME = {quick: '빠름', default: '보통', complex: '깊게'};

const askOpts = extra => Object.assign({ modelTier: askTier, cache: false }, extra);
$('#tierSel').innerHTML = TIERS.map(([v, l]) => `<option value="${v}"${v === askTier ? ' selected' : ''}>${l}</option>`).join('');
$('#tierSel').onchange = e => { askTier = e.target.value; try { localStorage.setItem('dash-ask-tier', askTier); } catch(x) {} toast('이제부터 ' + TIER_NAME[askTier] + ' 모델로 답함'); };

/* ---------- 경로 ---------- */
const winPath = rel => DATA.winRoot + '\\' + rel.replace(/\//g, '\\');
const baseName = rel => rel.split('/').pop();
const driveUrl = rel => 'https://drive.google.com/drive/search?q=' + encodeURIComponent(baseName(rel).replace(/\.[^.]+$/, ''));
function copyText(t, label) {
  const done = () => toast((label || '경로') + ' 복사함');
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); } catch(e) { fallbackCopy(t, done); }
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { toast('복사가 막혀 있음. 경로: ' + t); }
  ta.remove();
}
function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function fileRow(label, rel, when) {
  return `<div class="frow">${label ? `<span class="t">${esc(label)}</span>` : ''}<code title="${esc(winPath(rel))}">${esc(rel)}</code>
    ${when ? `<span class="t">${esc(when)}</span>` : ''}
    <button class="linkbtn" data-copy="${esc(winPath(rel))}">경로 복사</button>
    <a class="linkbtn" href="${esc(driveUrl(rel))}" target="_blank" rel="noopener">Drive에서 찾기</a></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });

/* ---------- 간단 마크다운 (답·메모용) ---------- */
function mdLite(src) {
  const keep = [];
  let s = String(src || '').replace(/\r/g, '');
  s = s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { keep.push(m); return '\u0000' + (keep.length - 1) + '\u0000'; });
  const inl = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
  const out = []; let list = null, para = [];
  const flushP = () => { if (para.length) { out.push('<p>' + inl(para.join(' ')) + '</p>'); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(i => '<li>' + inl(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
  for (const ln of s.split('\n')) {
    const h = ln.match(/^\s*(#{1,4})\s+(.*)$/), ul = ln.match(/^\s*[-*•]\s+(.*)$/), ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if (!ln.trim()) { flushP(); flushL(); continue; }
    if (h) { flushP(); flushL(); out.push('<p><strong>' + inl(h[2]) + '</strong></p>'); continue; }
    if (ul || ol) { flushP(); const t = ul ? 'ul' : 'ol'; if (!list || list.t !== t) { flushL(); list = {t, items: []}; } list.items.push((ul || ol)[1]); continue; }
    if (list && /^\s{2,}/.test(ln)) { list.items[list.items.length - 1] += ' ' + ln.trim(); continue; }
    flushL(); para.push(ln.trim());
  }
  flushP(); flushL();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => esc(keep[+i]));
}
function typeset(el) {
  const go = () => window.MathJax?.typesetPromise ? MathJax.typesetPromise([el]).catch(() => {}) : null;
  if (!go()) { let n = 0; const t = setInterval(() => { if (go() || ++n > 40) clearInterval(t); }, 250); }
}

/* ---------- 저장소: db (공유·영구) / 없으면 이 브라우저에만 ---------- */
const local = {
  load() { try { return JSON.parse(localStorage.getItem('dash-threads') || '{}'); } catch(e) { return {}; } },
  save(obj) { try { localStorage.setItem('dash-threads', JSON.stringify(obj)); } catch(e) {} }
};
const writes = new Map();
function putThread(t) {
  t.updatedAt = new Date().toISOString();
  threads.set(t.id, t);
  const body = JSON.parse(JSON.stringify(t));
  if (!dbLive) { const o = local.load(); o[t.id] = body; local.save(o); refreshNotes(); return Promise.resolve(); }
  const prev = writes.get(t.id) || Promise.resolve();
  const p = prev.then(() => store.doc('threads/' + t.id).set(body)).catch(e => toast('저장 실패: ' + (e.code || '') + ' — 잠시 뒤 다시 저장해 주세요'));
  writes.set(t.id, p); return p;
}
function delThread(id) {
  threads.delete(id);
  if (!dbLive) { const o = local.load(); delete o[id]; local.save(o); refreshNotes(); return; }
  store.doc('threads/' + id).delete().catch(e => toast('삭제 실패: ' + (e.code || '')));
}
async function initStore() {
  threads = new Map(Object.entries(local.load()));
  renderStatus();
  const cl = window.claude;
  if (!cl?.use) { renderStatus(); return; }
  try { sampleFn = await cl.use('sample'); } catch(e) { sampleFn = null; }
  try {   // 이 계정에서 쓸 수 없는 등급은 고르지 못하게 (limits가 없는 옛 화면이면 그대로 둠)
    const lim = sampleFn?.limits ? await sampleFn.limits() : null;
    if (lim?.modelTiers) $$('#tierSel option').forEach(o => { o.disabled = !lim.modelTiers.includes(o.value); });
  } catch(e) {}
  if (!sampleFn) $('#tierSel').closest('.tier').hidden = true;
  let db = null; try { db = await cl.use('db'); } catch(e) {}
  if (db) {
    store = db; dbLive = true;
    let first = true; const timer = setTimeout(() => { if (first) toast('노트 저장소에 아직 닿지 않음. 잠시 뒤 다시 보임'); }, 10000);
    db.collection('threads').onSnapshot(snap => {
      first = false; clearTimeout(timer);
      // 저장소가 주는 data()는 얼려진(frozen) 객체라 그대로 고치면 조용히 무시됨 → 복사해서 씀
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, JSON.parse(JSON.stringify(d.data()))));
      threads = m; refreshNotes();
    }, e => { clearTimeout(timer); toast('노트 저장소 연결이 끊김 (' + e.code + ')'); });
    db.doc('meta/sync').onSnapshot(s => {
      const before = syncMeta?.atIso; syncMeta = s.exists ? s.data() : null; renderStatus();
      if (before && syncMeta?.atIso && syncMeta.atIso !== before) toast(`md 사본에 반영됨 (${syncMeta.at}, ${syncMeta.count}건)`);
    }, () => {});
    db.doc('meta/syncRequest').onSnapshot(s => { syncReq = s.exists ? s.data() : null; renderStatus(); }, () => {});
    if (LIB) db.collection('summaries').onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, JSON.parse(JSON.stringify(d.data()))));
      sums = m; refreshSums();
    }, () => {});
    if (LIB) db.collection('reqs').onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, JSON.parse(JSON.stringify(d.data()))));
      reqs = m; refreshSums();
    }, () => {});
  }
  renderStatus();
}
/* 요약 탭의 추가 요청(절 요약·목차 정리 등) 저장소: db reqs/<id>, 없으면 이 브라우저 */
let reqs = new Map();
const localReqs = {
  load() { try { return JSON.parse(localStorage.getItem('dash-reqs') || '{}'); } catch(e) { return {}; } },
  save(o) { try { localStorage.setItem('dash-reqs', JSON.stringify(o)); } catch(e) {} }
};
if (LIB) reqs = new Map(Object.entries(localReqs.load()));
function putReq(r) {

function delReq(id) {

}
const reqsOf = key => [...reqs.values()].filter(r => r.key === key).sort((a, b) => (a.at || '').localeCompare(b.at || ''));
/* Claude 요약 저장소 (library): db summaries/<key>, 없으면 이 브라우저 */
const localSums = {
  load() { try { return JSON.parse(localStorage.getItem('dash-sums') || '{}'); } catch(e) { return {}; } },
  save(o) { try { localStorage.setItem('dash-sums', JSON.stringify(o)); } catch(e) {} }
};
if (LIB) sums = new Map(Object.entries(localSums.load()));
function putSum(s) {
  s.updatedAt = new Date().toISOString(); sums.set(s.key, s);
  if (!dbLive) { const o = localSums.load(); o[s.key] = s; localSums.save(o); refreshSums(); return Promise.resolve(); }
  return store.doc('summaries/' + s.key).set(JSON.parse(JSON.stringify(s))).catch(e => toast('요약 저장 실패: ' + (e.code || '')));

function delSum(key) {
  sums.delete(key);
  if (!dbLive) { const o = localSums.load(); delete o[key]; localSums.save(o); refreshSums(); return; }
  store.doc('summaries/' + key).delete().catch(e => toast('삭제 실패: ' + (e.code || '')));

function refreshSums() {
  renderStatus(); renderNav();
  const v = VIEWS[currentView];
  if (v?.special === 'sums') renderSumsView($('#view'));
  else if (v?.paper && (currentTab[v.id] || 'sum') === 'sum' && !$('#sumHost .streaming') && !$('#sumHost .thread.live') && !$('#sumHost .tedit') && !($('#reqText')?.value || '').trim()) renderSummaryTab(v);
}
function renderStatus() {
  const n = threads.size;
  let sync = '';
  if (syncMeta?.at) {
    const after = [...threads.values()].filter(t => !syncMeta.atIso || (t.updatedAt || '') > syncMeta.atIso).length;
    sync = `md 사본 반영 <b>${esc(syncMeta.at)}</b>` + (after ? ` · 그 뒤 바뀐 노트 <b>${after}</b>건` : ' · 최신');
  } else sync = 'md 사본: 아직 반영 전';
  if (syncReq?.requestedAt && (!syncMeta?.atIso || syncReq.requestedAt > syncMeta.atIso))
    sync += ` · <b>동기화 요청 대기 중</b> (${esc(fmt(syncReq.requestedAt))})`;
  $('#status').innerHTML = `<span><span class="dot ${dbLive ? 'on' : 'off'}"></span>${dbLive ? '노트 저장소 연결됨' : '노트가 이 브라우저에만 저장됨'}</span>
    <span>질문·메모 <b>${n}</b>건</span>${LIB ? `<span>Claude 요약 <b>${sums.size}</b>편</span>` : ''}<span>${sync}</span><span>생성 ${esc(DATA.built)}</span>`;
}

/* ---------- 목차 ---------- */
function renderNav() {
  const cnt = {};
  threads.forEach(t => { cnt[t.view] = (cnt[t.view] || 0) + 1; });
  if (LIB) return renderTree(cnt);
  $('#nav').innerHTML = DATA.views.map(g => `<h4>${esc(g.group)}</h4>` + g.items.map(it => {
    const c = it.id === 'notes' ? threads.size : (cnt[it.id] || 0);
    return `<a href="#${it.id}" data-v="${it.id}"${it.id === currentView ? ' aria-current="page"' : ''}><span>${esc(it.title)}</span>${c ? `<span class="cnt" title="질문·메모">${c}</span>` : ''}</a>`;
  }).join('')).join('');
}
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) $('#side').classList.remove('open'); });
$('#toggleNotes').onclick = () => {
  showNotes = !showNotes; try { localStorage.setItem('dash-show-notes', showNotes ? '1' : '0'); } catch(e) {}

  $('#toggleNotes').textContent = showNotes ? '질문·메모 숨기기' : '질문·메모 보이기';

/* ---------- 화면 ---------- */
function route() {
  const id = decodeURIComponent((location.hash || '').slice(1));
  const v = VIEWS[id] ? id : DATA.views[0].items[0].id;   // 해시가 없으면 첫 화면
  currentView = v; renderNav(); renderView(VIEWS[v]);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function summaryTiles() {   // DATA.summary = [{label, value, sub, alert, date, href}] (설정 파일의 summary()가 만듦)
  const s = DATA.summary || [];
  if (!s.length) return '';
  const sched = Object.values(VIEWS).find(v => v.schedule);
  return `<div class="tiles">${s.map(x => {
    // date가 있으면 D-day를 페이지를 연 날 기준으로 계산 (30일 안 주황, 지난 것 흐리게). 일정 화면이 있으면 누를 때 그리로 감
    const n = x.date ? ddays(x.date) : null;
    const cls = (x.alert ? ' alert' : '') + (n != null && n >= 0 && n <= 30 ? ' soon' : '') + (n != null && n < 0 ? ' done' : '');
    const href = x.href || (x.date && sched ? '#' + sched.id : '');
    const inner = `<span>${esc(x.label)}</span><b>${esc(x.date ? ddLabel(x.date) : x.value)}</b><span>${esc(x.sub || (x.date ? x.date + (href ? ' · 전체 일정 보기' : '') : ''))}</span>`;
    return href ? `<a class="tile${cls}" href="${esc(href)}">${inner}</a>` : `<div class="tile${cls}">${inner}</div>`;
  }).join('')}</div>`;
}

/* ---------- 일정·D-day (dash 1.3.0): 오늘 날짜로 그때그때 계산. 설정 SCHEDULE = {start, end, tiles:[[이름, 날짜]], marks:[[이름, 날짜]]} ---------- */
const DAY = 86400000;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const ddays = s => Math.round((parseD(s) - today0()) / DAY);
const ddLabel = s => { const n = ddays(s); return n > 0 ? `D-${n}` : n === 0 ? 'D-day' : `D+${-n}`; };
function scheduleHtml() {
  const S = DATA.schedule; if (!S || !S.start || !S.end) return '';
  const t0 = parseD(S.start), t1 = parseD(S.end), now = today0(), tiles = S.tiles || [], marks = S.marks || [];
  const total = Math.round((t1 - t0) / DAY), passed = Math.min(total, Math.max(0, Math.round((now - t0) / DAY)));
  const pct = x => Math.max(0, Math.min(100, (x - t0) / (t1 - t0) * 100)).toFixed(2);
  const next = tiles.find(([, d]) => ddays(d) >= 0);
  return `<div class="tiles">${tiles.map(([a, d]) => { const n = ddays(d);
      return `<div class="tile${n >= 0 && n <= 30 ? ' soon' : ''}${n < 0 ? ' done' : ''}"><span>${esc(a)}</span><b>${ddLabel(d)}</b><span>${esc(d)}</span></div>`; }).join('')}</div>
    <div class="period" role="img" aria-label="과제 기간 ${total}일 중 ${passed}일 지남">
      <div class="ptrack"><div class="pfill" style="width:${pct(now)}%"></div>

function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function sectionPath(blk) {
  const path = []; let lv = 9; let e = blk;
  while ((e = e.previousElementSibling)) {
    const h = e.matches('.k-h') ? e.querySelector('h1,h2,h3,h4') : null;
    if (h) { const l = +h.tagName[1]; if (l < lv) { path.unshift(h.innerText.trim()); lv = l; if (l <= 1) break; } }
  }
  return path.join(' › ');
}
function contextOf(blk) {
  const take = (el, n, dir) => { const out = []; let e = el; while (out.length < n && (e = dir ? e.nextElementSibling : e.previousElementSibling)) if (e.matches('.blk')) out.push((blockText.get(e.dataset.b) || '').slice(0, 1400)); return dir ? out : out.reverse(); };
  return { before: take(blk, 4, false).join('\n\n'), after: take(blk, 2, true).join('\n\n') };
}
const RULES = DATA.rules;   // 설정 파일의 RULES (질문 도우미 규칙)
function buildInput(t, q) {

[문서] ${t.docTitle}
[위치] ${t.section || '(문서 처음)'}
${t.quote ? `[사용자가 선택한 문장]\n${t.quote}\n` : ''}
[해당 문단]
${(t.blockText || '').slice(0, 4000)}

[앞 문맥]
${(t.ctxBefore || '').slice(0, 5000)}

[뒤 문맥]
${(t.ctxAfter || '').slice(0, 2500)}`;
  const turns = t.turns || [];
  if (!turns.length) return [{role: 'user', content: head + '\n\n질문: ' + q}];
  const msgs = [{role: 'user', content: head + '\n\n질문: ' + turns[0].q}];

  msgs.push({role: 'user', content: q});
  return msgs;
}

async function runAsk(el, t, q, isNew) {

  const paper = k => { const p = PAPERS[k]; if (q && !metaMatch(p, q)) return ''; const n = cnt['p-' + k] || 0;
    return `<a class="pp" href="#p-${k}" data-v="p-${k}"${'p-' + k === currentView ? ' aria-current="page"' : ''} title="${esc(p.t)}${p.a ? ' — ' + esc(p.a) : ''}"><span class="y">${esc(p.y || '----')}</span><span class="tt">${esc(p.t)}</span>${sums.has(k) ? '<span class="mk" title="Claude 요약 있음">★</span>' : ''}${n ? `<span class="cnt" title="질문·메모">${n}</span>` : ''}</a>`; };
  const count = node => (node._p || []).length + Object.values(node._d || {}).reduce((s, x) => s + count(x), 0);
  const walk = (node, path) => {

const SUM_RULES_DEFAULT = `너는 레이저·광학 논문을 한국어로 요약하는 도우미다. 독자는 이 분야 대학원생이다. 아래 [자료]만 근거로 쓰고, 자료에 없는 수치·주장은 지어내지 않는다 (모르면 "자료에 없음"). 수식은 $...$ LaTeX. 형식(마크다운, 소제목 그대로):
## 한 줄 요약
## 연구 질문과 배경
## 방법 (장치·시료·조건)
## 핵심 결과 (수치를 그대로)
## 의의와 한계
그림은 따로 모으지 말고 본문 안에 녹인다: [자료]의 그림·표 목록에서 핵심 2~4개를 골라, 그 그림이 무엇을 보여 주는지 설명하는 문장을 쓰고 그 문장 끝에 [[Fig 1]] 처럼 대괄호 두 겹으로 번호를 붙인다 (표는 [[Tab 1]]). 예: "…흡수체가 있으면 펄스가 안정되는 공진기 범위가 넓어지는데, 이를 보여 주는 것이 [[Fig 2]]이다." 같은 그림은 한 번만, 목록에 없는 번호는 쓰지 않는다. 그림 번호를 "그림:" 줄로 따로 모으지 않는다.
본문 뒤에 아래 절을 붙인다 (본문에서 [[…]]로 가리킨 그림마다 하나씩, 다른 그림은 쓰지 않음):
## 그림 설명
### [[Fig 1]]
**캡션(한글)**: 원 캡션을 한국어로 옮김 (전문용어는 영문 병기)
**보는 법**: 축·곡선·기호·패널이 각각 무엇인지, 어디를 봐야 하는지, 수치가 뜻하는 것, 본문 결론과 어떻게 이어지는지 3~6문장. 자료에 없는 것은 "자료에 없음".
전체 1500~3500자.`;
/* 요약 문단 ID: 'sum:' + djb2(문단 글자) — notes_sync.py 의 sum_block_id 와 같은 규칙 (요약 md 사본의 같은 자리에 노트가 들어감) */
function h32(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
function sumChunks(text) {   // 빈 줄로 나눈 문단 (마지막 "그림: …" 줄은 뺌)
  const out = [];
  String(text || '').replace(/\r/g, '').replace(/^\s*그림\s*[:：].*$/m, '').split(/\n{2,}/).map(c => c.trim()).filter(Boolean).forEach(c => {
    const i = c.indexOf('\n');                       // "## 제목\n본문" 은 제목과 본문을 따로 (질문은 본문 문단에 달리게)
    if (/^#{1,4}\s/.test(c) && i > 0) { out.push(c.slice(0, i).trim()); out.push(c.slice(i + 1).trim()); } else out.push(c);
  });
  return out.filter(Boolean);
}
const FIGREF_RE = /\[\[\s*(fig(?:ure)?|tab(?:le)?)\.?\s*([A-Za-z0-9][A-Za-z0-9\-]*)\s*\]\]/gi;
const figLabel = (kind, num) => (/^f/i.test(kind) ? 'Fig ' : 'Tab ') + num;
function inlineFigs(c) { return [...c.matchAll(FIGREF_RE)].map(m => figLabel(m[1], m[2])); }
function splitFigNotes(text) {   // "## 그림 설명" 절을 떼어 {label: 설명} 으로 (notes_sync.py split_fig_notes 와 같은 규칙)
  const s = String(text || '').replace(/\r/g, '');
  const m = s.match(/^##\s*그림\s*설명.*$/m);
  if (!m) return { main: s, notes: {} };
  const main = s.slice(0, m.index), notes = {};
  s.slice(m.index + m[0].length).split(/^###\s*/m).forEach(piece => {
    const nl = piece.indexOf('\n'), head = nl < 0 ? piece : piece.slice(0, nl), body = nl < 0 ? '' : piece.slice(nl + 1).trim();
    const f = [...head.matchAll(FIGREF_RE)][0]; if (f && body) notes[figLabel(f[1], f[2])] = body;
  });
  return { main, notes };
}
const sumId = c => 'sum:' + h32(c.replace(/\s+/g, ' ').trim());
function sumBlocks(key, text, shown, notes) {   // 문단 안의 [[Fig n]] 자리에 번호 칩, 그 문단 바로 아래에 그 그림 + 한글 캡션·보는 법
  return sumChunks(text).map(c => {
    const id = sumId(c);
    const h = c.match(/^#{1,4}\s+(.*)$/);
    if (h && !c.includes('\n')) return `<div class="blk k-h" data-b="${id}"><h3>${esc(h[1])}</h3></div>`;
    const labels = inlineFigs(c).filter(l => !shown.has(l) && shown.add(l));
    const html = mdLite(c).replace(FIGREF_RE, (m, k, n) => `<span class="figref">${esc(figLabel(k, n))}</span>`);
    return `<div class="blk k-p" data-b="${id}">${html}${sumFigures(key, labels, notes)}</div>`;
  }).join('');
}

/* ---------- 추가 요청: 절 요약·목차 정리 등 (긴 논문·학위논문·서적용). 요청마다 카드 하나, 따로 고치고 지움 ---------- */
const REQ_RULES_DEFAULT = `너는 레이저·광학 논문을 한국어로 정리하는 도우미다. 독자는 이 분야 대학원생이다. 아래 [자료]만 근거로 [요청]을 수행한다. 자료에 없는 수치·주장은 지어내지 않는다 (모르면 "자료에 없음"). 수식은 $...$ LaTeX. 마크다운으로, 소제목(##)과 목록을 써서 읽기 쉽게. 요청이 절·장 요약이면 그 절의 논리 흐름·핵심 수치·결론을 빠짐없이, 요청이 목차 정리면 각 절이 무엇을 다루는지 한두 줄씩. [자료]에 그림·표 목록이 있고 요청과 관련되면, 그 그림이 무엇을 보여 주는지 쓰는 문장 끝에 [[Fig 1]] 처럼 번호를 붙인다(같은 그림은 한 번만, 목록에 없는 번호는 쓰지 않음). 길이는 요청에 맞춘다(보통 800~3000자).`;
const REQ_CHIPS = ['목차를 절마다 한두 줄로 정리해 줘', 'Introduction 요약해 줘', '실험 방법(Experimental) 요약해 줘', '결과와 결론 요약해 줘'];
const KO_WORDS = { '서론': 'introduction', '도입': 'introduction', '배경': 'background', '이론': 'theor', '방법': 'method', '실험': 'experiment', '장치': 'setup', '결과': 'result', '토의': 'discussion', '논의': 'discussion', '결론': 'conclusion', '요약': 'summary', '초록': 'abstract', '부록': 'appendix', '모델': 'model', '시뮬레이션': 'simulation', '측정': 'measurement', '설계': 'design', '참고문헌': 'reference' };
function pickSections(q, sections) {   // 요청 글에서 절 번호·낱말을 뽑아 맞는 절(과 그 하위 절)을 고름. 못 고르면 전체 개요
  const ql = q.toLowerCase();
  const nums = [...ql.matchAll(/(?:chapter|chap\.?|section|sec\.?|part|장|절)?\s*(\d+(?:\.\d+)*)\s*(?:장|절)?/g)].map(m => m[1]).filter(n => n.length <= 6);
  const words = new Set((ql.match(/[a-z][a-z\-]{3,}/g) || []));
  Object.entries(KO_WORDS).forEach(([k, e]) => { if (ql.includes(k)) words.add(e); });
  const hit = sections.map((s, i) => {
    const h = s.h.toLowerCase(); let sc = 0;
    const hn = h.match(/^(?:chapter|chap\.?|section|sec\.?|part)?\s*(\d+(?:\.\d+)*)/);
    nums.forEach(n => { if (hn && (hn[1] === n || hn[1].startsWith(n + '.'))) sc += 3; });
    words.forEach(w => { if (h.includes(w)) sc += 2; });
    return sc;
  });
  let sel = sections.filter((s, i) => hit[i] > 0);
  const mode = sel.length ? 'sections' : 'overview';
  if (!sel.length) sel = sections;
  const outline = sections.map(s => '  '.repeat(Math.max(0, s.l - 2)) + '- ' + s.h).join('\n');
  let budget = 60000, body = '';
  if (mode === 'sections') {
    const each = Math.max(3000, Math.floor(budget / sel.length));
    body = sel.map(s => `### ${s.h}\n${s.t.length > each ? s.t.slice(0, each) + ' …(이하 생략)' : s.t}`).join('\n\n');
  } else {
    const each = Math.max(300, Math.floor(40000 / Math.max(1, sel.length)));
    body = sel.map(s => `### ${s.h}\n${s.t.slice(0, each)}${s.t.length > each ? ' …' : ''}`).join('\n\n');
  }
  return { mode, outline, body: body.slice(0, budget), picked: mode === 'sections' ? sel.map(s => s.h) : [] };
}

[논문] ${b.title || p.t} (${[b.author || p.a, b.journal || p.j, b.year || p.y].filter(Boolean).join(', ')})
${b.abstract ? `[초록]\n${b.abstract.slice(0, 3000)}\n` : ''}
[목차]
${pk.outline.slice(0, 6000)}

[${pk.mode === 'sections' ? '요청과 관련된 절의 본문' : '각 절의 앞부분 (전체 개요)'}]
${pk.body}
${b.figs?.length ? `\n[그림·표 목록]\n${b.figs.map(f => `${f.label}: ${f.cap || '(캡션 없음)'}`).join('\n').slice(0, 6000)}` : ''}`;

  }
  const load = src => new Promise(res => { const i = new Image(); const t = setTimeout(() => res(false), 15000);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth > 0); }; i.onerror = () => { clearTimeout(t); res(false); }; i.src = src; });
  const srcs = [...imgs.keys()], bad = [];
  for (let i = 0; i < srcs.length; i += 12) {
    const r = await Promise.all(srcs.slice(i, i + 12).map(load));
    r.forEach((ok, j) => { if (!ok) bad.push(srcs[i + j] + ' (' + imgs.get(srcs[i + j]) + ')'); });
    const l = out.querySelector('.loading'); if (l) l.textContent = `그림 확인 중… ${Math.min(i + 12, srcs.length)}/${srcs.length}`;
  }
  const views = DATA.views.flatMap(g => g.items).filter(v => v.tabs).flatMap(v => v.tabs.map(t => t[0]).concat(v.card ? [v.card] : []));
  const noDoc = LIB ? [] : views.filter(k => !DATA.docs[k]);
  let cm = null; try { cm = await window.claude?.use?.('comments'); } catch(e) {}
  const st = cm ? await cm.canSendToClaude().catch(() => 'off') : '없음';
  const ok = !badDocs.length && !bad.length && !noDoc.length;
  out.innerHTML = `<div class="notice" style="border-color:${ok ? 'var(--ok)' : 'var(--bad)'};background:${ok ? 'var(--ok-soft)' : 'var(--bad-soft)'}">
      <b style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? '이상 없음' : '문제 있음'}</b> · ${LIB ? `논문 ${Object.keys(DATA.docs).length}편 목록` : `문서 ${rows.length}개, 그림 ${srcs.length}장`} 확인 (${new Date().toLocaleString('ko-KR')})</div>
    <div class="tbl"><table><tbody>
      ${LIB ? '' : `<tr><th>문서</th><td>${badDocs.length ? '<b style="color:var(--bad)">' + esc(badDocs.join(', ')) + '</b>' : `${rows.length}개 모두 열림 (블록 ${rows.reduce((a, r) => a + r[1], 0)}개)`}</td></tr>
      <tr><th>그림</th><td>${bad.length ? `<b style="color:var(--bad)">${bad.length}장 실패</b><br>` + bad.slice(0, 20).map(esc).join('<br>') : `${srcs.length}장 모두 열림`}</td></tr>
      <tr><th>탭 연결</th><td>${noDoc.length ? '<b style="color:var(--bad)">문서 없는 탭: ' + esc(noDoc.join(', ')) + '</b>' : '모든 탭이 문서에 연결됨'}</td></tr>`}
      <tr><th>노트 저장소</th><td>${dbLive ? '연결됨' : '연결 안 됨 (이 브라우저에만 저장)'} · 질문·메모 ${threads.size}건</td></tr>
      <tr><th>Claude 질문</th><td>${sampleFn ? '쓸 수 있음' : '쓸 수 없음 (claude.ai에서 열어야 함)'}</td></tr>
      <tr><th>노트 동기화 버튼</th><td>${st === 'available' ? 'Claude 세션에 바로 보냄' : st === 'no_session' ? '지금 받는 세션 없음 → 요청만 남김' : '댓글 기능 없음 → 요청만 남김'}</td></tr>
      <tr><th>엔진</th><td>dash ${esc(DATA.engine || '')} · 생성 ${esc(DATA.built || '')}</td></tr>
    </tbody></table></div>`;
}

/* ---------- 시작 ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTool(); $('#side').classList.remove('open'); $('.lightbox')?.remove(); } });
renderNav(); route(); initStore().then(refreshNotes);
</script>
